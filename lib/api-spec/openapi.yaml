openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MadarX AI OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI Chat operations
  - name: memory
    description: Memory operations
  - name: files
    description: File operations
  - name: agents
    description: Agent operations
  - name: analytics
    description: Analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat/conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /chat/conversations/{id}:
    get:
      operationId: getConversation
      tags: [chat]
      summary: Get a conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
    patch:
      operationId: updateConversation
      tags: [chat]
      summary: Rename a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chat/conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message and get AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /chat/stream/{id}:
    post:
      operationId: streamMessage
      tags: [chat]
      summary: Stream AI response (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /memory:
    get:
      operationId: listMemories
      tags: [memory]
      summary: List saved memories
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memory]
      summary: Save a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memory/{id}:
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List uploaded files
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserFile"

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List available agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get dashboard analytics overview
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [analytics]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        model:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messageCount:
          type: integer
      required: [id, title, model, createdAt, updatedAt, messageCount]

    ConversationInput:
      type: object
      properties:
        title:
          type: string
        model:
          type: string
      required: [title]

    ConversationUpdate:
      type: object
      properties:
        title:
          type: string

    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        model:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required: [id, title, model, createdAt, updatedAt, messages]

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        model:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, conversationId, role, content, createdAt]

    MessageInput:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
      required: [content]

    Memory:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
        createdAt:
          type: string
      required: [id, title, content, category, createdAt]

    MemoryInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
      required: [title, content, category]

    UserFile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        createdAt:
          type: string
      required: [id, name, size, mimeType, createdAt]

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        isActive:
          type: boolean
        tasksCompleted:
          type: integer
      required: [id, name, description, category, isActive, tasksCompleted]

    AnalyticsOverview:
      type: object
      properties:
        totalMessages:
          type: integer
        totalConversations:
          type: integer
        totalMemories:
          type: integer
        totalFiles:
          type: integer
        modelsUsed:
          type: array
          items:
            type: string
        dailyUsage:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsage"
      required: [totalMessages, totalConversations, totalMemories, totalFiles, modelsUsed, dailyUsage]

    DailyUsage:
      type: object
      properties:
        date:
          type: string
        messages:
          type: integer
        tokens:
          type: integer
      required: [date, messages, tokens]

    DashboardStats:
      type: object
      properties:
        activeModels:
          type: integer
        activeAgents:
          type: integer
        memoryUsed:
          type: integer
        storageUsed:
          type: integer
        cpuUsage:
          type: integer
        systemStatus:
          type: string
      required: [activeModels, activeAgents, memoryUsed, storageUsed, cpuUsage, systemStatus]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        module:
          type: string
        timeAgo:
          type: string
        createdAt:
          type: string
      required: [id, type, title, description, module, timeAgo, createdAt]
